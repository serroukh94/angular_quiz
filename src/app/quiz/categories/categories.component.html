<ul class="categories_container">
  <li *ngFor="let category of categories; let j = index">
    <button
      (click)="setCategoryId(category.id)"
      [class.categories_container--selected]="getSelectedCategoryId() === category.id"
    >
      <span>{{ j + 1 }}</span>Category {{ category?.categoryLabel }}
    </button>
  </li>
  <button (click)="onConfirmCategory()" *ngIf="getSelectedCategoryId() != null" class="btn">Continuer</button>
</ul>
